schema-version = "1.19.0"


## Install Packages --------------------------------------------------
##  $ flox install gum  <- puts a package in [install] section below
##  $ flox search gum   <- search for a package
##  $ flox show gum     <- show all versions of a package
## -------------------------------------------------------------------
[install]
nodejs.pkg-path           = "nodejs"
python3.pkg-path          = "python3"
python3.version           = ">=3.14.*"
flox-mcp-server.pkg-path  = "flox/flox-mcp-server"
flox-mcp-server.pkg-group = "flox-mcp-server"
faiss.pkg-path            = "flox-cuda/faiss"
faiss.pkg-group           = "faiss"
numpy.pkg-path            = "flox-cuda/python3Packages.numpy"
numpy.pkg-group           = "numpy"
elasticsearch.pkg-path    = "python314Packages.elasticsearch"
pyarrow.pkg-path          = "python314Packages.pyarrow"
pip.pkg-path              = "python314Packages.pip"
uv.pkg-path               = "uv"
pandas.pkg-path           = "python314Packages.pandas"
transformers.pkg-path     = "flox-cuda/python3Packages.transformers"
transformers.pkg-group    = "transformers"
bun.pkg-path              = "bun"


## Environment Variables ---------------------------------------------
##  ... available for use in the activated environment
##      as well as [hook], [profile] scripts and [services] below.
## -------------------------------------------------------------------
[vars]
# INTRO_MESSAGE = "It's gettin' Flox in here"
ES_URL = "https://stories-ec0351.es.us-east4.gcp.elastic.cloud:443"
#ES_API_KEY = "{ES_API_KEY}"

## Activation Hook ---------------------------------------------------
##  ... run by _bash_ shell when you run 'flox activate'.
## -------------------------------------------------------------------
[hook]
on-activate = """
  bun install

  export PYTHON_DIR="$FLOX_ENV_PROJECT/.venv"
  if [ ! -d "$PYTHON_DIR" ]; then
    echo "Creating python virtual environment in $PYTHON_DIR"
    uv venv "$PYTHON_DIR"
  fi

  (
    source "$PYTHON_DIR/bin/activate"
    uv sync
  )

"""


## Profile script ----------------------------------------------------
## ... sourced by _your shell_ when you run 'flox activate'.
## -------------------------------------------------------------------
[profile]
bash = """
  echo "Activating python virtual environment" >&2
  source "$PYTHON_DIR/bin/activate"
"""


## Services ---------------------------------------------------------
##  $ flox services start             <- Starts all services
##  $ flox services status            <- Status of running services
##  $ flox activate --start-services  <- Activates & starts all
## ------------------------------------------------------------------
[services]
# myservice.command = "python3 -m http.server"


## Include ----------------------------------------------------------
## ... environments to create a composed environment
## ------------------------------------------------------------------
[include]
# environments = [
#     { dir = "../common" }
# ]


