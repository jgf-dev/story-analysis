[project]
name            = "story-analysis"
version         = "0.0.0"
requires-python = ">=3.14.0"

dependencies = [
    "dotenv>=0.9.9",
    "edge-tts>=7.3.1",
    "elasticsearch>=9.5.1",
    "faiss-gpu-cuvs>=1.16.0",
    "flask>=3.1.3",
    "numpy[cuda,gpu]>=2.5.4",
    "pandas>=3.1.1",
    "pillow>=11.1.0",
    "scikit-learn>=1.9.1",
    "transformers>=5.23.0",
    "unstructured-transform-client>=0.18.94",
]

[dependency-groups]
dev = ["pylance>=13.0.0", "pyrefly>=1.4.0", "pytest>=9.1.1", "ruff>=0.17.1"]
